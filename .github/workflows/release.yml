name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Chrome Web Store package
        run: ./release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/x-recommendation-checker-$GITHUB_REF_NAME.zip#Chrome Web Store package"
          --verify-tag
          --generate-notes
